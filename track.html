
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track - TrustLogistics</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}header{background:#0a2540;color:#fff;padding:12px;text-align:center;position:relative}.navTop{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}.navTop a{background:rgba(255,255,255,0.15);color:#fff;padding:6px 12px;border-radius:16px;font-size:11px;text-decoration:none;border:1px solid rgba(255,255,255,0.25)}#map{height:68vh;width:100%}.bar{padding:10px;background:#eef2ff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.status{background:#fff;border-radius:12px;padding:12px;margin:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.btn{background:#0066ff;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;font-size:12px}</style></head><body><header><div class="navTop"><a href="index.html" onclick="localStorage.clear();sessionStorage.clear();">Logout ↪</a><a href="tracking.html">Allan/DF/110</a><a href="admin.html">Admin Panel</a></div><h2>TrustLogistics - Customer Tracking</h2><p id="tid"></p></header><div id="map"></div><div class="bar"><div><span id="origin">Origin: -</span> -> <span id="dest">Dest: -</span></div><div><button class="btn" onclick="map.zoomIn()">Zoom +</button> <button class="btn" onclick="map.zoomOut()">Zoom -</button> <a class="btn" href="tracking.html">Allan Map</a></div></div><div class="status" id="statusBox">Loading...</div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,doc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";const firebaseConfig={projectId:"trustlogistics-package-dlv"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);const trackingId=new URLSearchParams(location.search).get('id')||'TL-123';document.getElementById('tid').innerText='Tracking: '+trackingId;const map=L.map('map',{zoomControl:false}).setView([51.5,-0.12],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);let marker,routeLine;async function drawRoute(orig,dest){if(!orig||!dest)return;try{const url=`https://router.project-osrm.org/route/v1/driving/${orig[1]},${orig[0]};${dest[1]},${dest[0]}?overview=full&geometries=geojson`;const r=await fetch(url);const j=await r.json();if(j.routes&&j.routes[0]){const coords=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(coords,{color:'#0066ff',weight:5}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[30,30]});}}catch(e){}}function updateUI(data){document.getElementById('origin').innerText='Origin: '+(data.originName||'-');document.getElementById('dest').innerText='Dest: '+(data.destName||'-');document.getElementById('statusBox').innerHTML=`<b>Status:</b> ${data.status||'In Transit'}<br><b>Location:</b> ${data.lat?.toFixed(4)}, ${data.lng?.toFixed(4)}<br><b>Updated:</b> ${new Date().toLocaleString()}<br><b>ETA:</b> ${data.eta||'Today'}`;if(data.lat){if(!marker)marker=L.marker([data.lat,data.lng]).addTo(map);else marker.setLatLng([data.lat,data.lng]);}if(data.origin&&data.dest)drawRoute(data.origin,data.dest);}onSnapshot(doc(db,"packages",trackingId),(snap)=>{if(snap.exists())updateUI(snap.data());else onSnapshot(doc(db,"settings","current"),(s2)=>{if(s2.exists())updateUI(s2.data());else document.getElementById('statusBox').innerText='No data yet. Ask admin to update location.';});});</script></body></html>
