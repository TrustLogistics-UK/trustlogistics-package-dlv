
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustLogistics Login - Package Type Fields</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden}body::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg, rgba(7,25,50,0.93) 0%, rgba(7,25,50,0.85) 45%, rgba(7,25,50,0.65) 100%), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1600&auto=format&fit=crop');background-size:cover;background-position:center;z-index:0}.card{position:relative;z-index:1;background:#fff;width:100%;max-width:420px;padding:26px 22px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.35)}.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:4px}.logo{width:46px;height:46px;background:#0a2540;color:#fff;border-radius:12px;display:grid;place-items:center;font-size:22px}h2{text-align:center;color:#0a2540;font-size:22px}.sub{text-align:center;color:#64748b;font-size:12px;margin:8px 0 16px;line-height:1.4}input{width:100%;padding:14px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;margin-bottom:10px;background:#f8fafc}input:focus{outline:none;border-color:#0066ff;background:#fff;box-shadow:0 0 0 3px rgba(0,102,255,0.12)}.dropdown{position:relative;width:100%;margin-bottom:12px}.dropbtn{width:100%;background:#fff;border:2px solid #0a2540;color:#0a2540;padding:13px 14px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.drop-content{display:none;position:absolute;top:108%;left:0;width:100%;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,0.18);border:1px solid #e2e8f0;overflow:hidden;z-index:999}.drop-content div{padding:13px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9}.drop-content div:hover{background:#eef2ff;font-weight:700}.drop-content.show{display:block}button.login{width:100%;padding:14px;background:linear-gradient(90deg,#0066ff,#0a2540);color:#fff;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px}.trust{margin-top:16px;background:linear-gradient(180deg,#f8fafc,#eef2ff);padding:14px;border-radius:12px;border:1px solid #dbe2ff}.trust h4{color:#0a2540;font-size:13px;margin-bottom:6px}.trust p{font-size:11.5px;color:#334155;line-height:1.6}.error{color:#dc2626;font-size:12px;text-align:center;display:none;background:#fef2f2;padding:10px;border-radius:8px;border:1px solid #fecaca;font-weight:600;margin-top:6px}.hint{font-size:10.5px;color:#64748b;margin:-6px 0 10px 2px}</style></head><body><div class="card"><div class="brand"><div class="logo">🚚</div><h2>TrustLogistics</h2></div><p class="sub">Select Package Type to show correct tracking fields</p><div class="dropdown"><button class="dropbtn" onclick="toggleDrop()"><span id="pkgLabel">📦 PACKAGE TYPE</span><span>▾</span></button><div id="pDrop" class="drop-content"><div onclick="setPkg('VEHICLE')">🚗 VEHICLE</div><div onclick="setPkg('GADGETS')">📱 GADGETS</div><div onclick="setPkg('CONSUMABLES')">📦 CONSUMABLES</div></div></div><div id="formArea" style="display:none"><input id="field1" type="text" placeholder="TRU-UK-PAC-001" autocomplete="off"><div id="hint1" class="hint"></div><input id="field2" type="text" placeholder="H12345/IMEI/001" autocomplete="off"><div id="hint2" class="hint"></div></div><div id="err" class="error"></div><button class="login" onclick="doLogin()">Login to Track Shipment →</button><div class="trust"><h4>⭐ Why TrustLogistics?</h4><p><b>Efficient, Dedicated & Trustworthy</b> — Over 50,000 shipments monthly, 99.2% on-time. Real-time GPS, dedicated van monitoring, secure handling Morden → Northumberland.</p></div></div><script>let selectedPkg='';const configs={VEHICLE:{p1:"TRU-UK-PAC-001",h1:"Package AWB - Vehicle Shipment",p2:"H12345/IMEI/001",h2:"VIN / IMEI - Vehicle Tracking"},GADGETS:{p1:"TRU-UK-GAD-2024-001",h1:"Gadget Tracking ID - e.g. Phones, Laptops",p2:"GADG-SN-88XX-IMEI/001",h2:"Serial No / IMEI - Gadget Verification"},CONSUMABLES:{p1:"TRU-UK-CON-BATCH-001",h1:"Consumable Batch ID - Food, Medical, Chemicals",p2:"LOT-EXP-2025/001 / CONS-001",h2:"Lot Number / Expiry Reference"}};function toggleDrop(){document.getElementById('pDrop').classList.toggle('show');}function setPkg(t){selectedPkg=t;document.getElementById('pkgLabel').innerText='📦 '+t;document.getElementById('pDrop').classList.remove('show');localStorage.setItem('tl_pkg_type',t);const cfg=configs[t];document.getElementById('formArea').style.display='block';document.getElementById('field1').placeholder=cfg.p1;document.getElementById('field2').placeholder=cfg.p2;document.getElementById('hint1').innerText=cfg.h1;document.getElementById('hint2').innerText=cfg.h2;document.getElementById('field1').value='';document.getElementById('field2').value='';document.getElementById('err').style.display='none';}window.addEventListener('click',(e)=>{if(!e.target.closest('.dropdown')){const d=document.getElementById('pDrop');if(d)d.classList.remove('show');}});const saved=localStorage.getItem('tl_pkg_type');if(saved&&configs[saved]){setPkg(saved);}function doLogin(){const u=document.getElementById('field1').value.trim();const p=document.getElementById('field2').value.trim();const err=document.getElementById('err');if(!selectedPkg){err.style.display='block';err.innerText="Error: Detail's don't match any package.";return;}if(selectedPkg!=='VEHICLE'){err.style.display='block';err.innerText="Error: Detail's don't match any package.";return;}if(u==='Admin'&&p==='Admin'){localStorage.setItem('trust_admin','yes');localStorage.removeItem('trust_track');location.href='admin.html';return;}if(u==='TRU-UK-VEH-001'&&p==='H432456/IMEI/110'){localStorage.setItem('trust_track','yes');localStorage.setItem('trust_awb',u);localStorage.removeItem('trust_admin');location.href='index.html';return;}err.style.display='block';err.innerText="Error: Detail's don't match any package.";}</script></body></html>
