
<script>
function handleLogin(){
  const awb = document.getElementById('awb').value.trim();
  const vin = document.getElementById('vin').value.trim();

  // CLIENT LOGIN -> Tracking Page
  if(awb === 'Allan/DF/110' && vin === 'H432456/IMEI/110'){
    localStorage.setItem('trust_track','ok');
    location.href='index.html';
    return;
  }

  // ADMIN LOGIN -> Admin Page (BOTH WORK)
  if(awb.toLowerCase() === 'admin' && vin.toLowerCase() === 'admin'){
    location.href='admin.html';
    return;
  }

  // Also allow PACKAGE TYPE = Admin if you use dropdown
  if(document.getElementById('packageType') && document.getElementById('packageType').value.toLowerCase() === 'admin'){
     if(vin.toLowerCase() === 'admin' || awb.toLowerCase() === 'admin'){
       location.href='admin.html';
       return;
     }
  }

  alert('Invalid credentials. Use Allan/DF/110 or Admin/Admin');
}
</script>
