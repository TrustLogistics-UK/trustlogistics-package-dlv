<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustLogistics Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a2540;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;width:100%;max-width:380px;padding:24px;border-radius:16px}
h2{text-align:center;color:#0a2540;margin-bottom:6px}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:18px}
label{font-size:13px;font-weight:bold;display:block;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{width:100%;padding:12px;background:#0066ff;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:18px}
.hint{margin-top:14px;background:#f5f7ff;padding:10px;border-radius:8px;font-size:12px;line-height:1.5}
.error{color:#d00;font-size:13px;margin-top:10px;display:none;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2>TrustLogistics</h2>
<p class="sub">Package Tracking & Admin Portal</p>
<label>AWB / Username</label>
<input id="user" type="text" placeholder="TRU-UK-VEH-001 or Admin">
<label>VIN / Password</label>
<input id="pass" type="text" placeholder="H432110/IMEI/110 or Admin">
<div id="err" class="error"></div>
<button onclick="doLogin()">Login to Track</button>
<div class="hint"><b>Access:</b><br>• Admin: <b>Admin / Admin</b> → Admin Panel<br>• Tracking: <b>TRU-UK-VEH-001 / H432110/IMEI/110</b> → Live Tracking</div>
</div>
<script>
function doLogin(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(u==='Admin' && p==='Admin'){localStorage.setItem('trust_admin','yes');localStorage.removeItem('trust_track');location.href='admin.html';return;}
  if(u==='TRU-UK-VEH-001' && p==='H432110/IMEI/110'){localStorage.setItem('trust_track','yes');localStorage.setItem('trust_awb','TRU-UK-VEH-001');localStorage.removeItem('trust_admin');location.href='index.html';return;}
  document.getElementById('err').style.display='block';document.getElementById('err').innerText='Invalid. Use Admin/Admin or TRU-UK-VEH-001 / H432110/IMEI/110';
}
</script>
</body>
</html>
