<!DOCTYPE html>
<html>
<head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin - Allan/DF/110 - FULL CONTROL</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js'></script><script src='https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js'></script><style>

.hdr{position:relative;z-index:2;max-width:1300px;margin:0 auto}

</style></head><body>
<div class="company-head">ADMIN VIEW - Trust Logistics UK - Allan/DF/110</div>

<div style="max-width:1300px;margin:14px auto 0;padding:0 12px">
<div style="background:#fff;color:#0a2540;border-radius:16px;padding:16px;border:2px solid #dc2626">
<b>PACKAGE MOVEMENT CONTROL (Admin only - controls tracking.html)</b><br><br>
<button class="p" onclick="pause()">⏸ Pause</button>
<button class="r" onclick="resume()">▶ Resume</button>
<button class="y" onclick="move(-0.10)">⏪ Rewind -10%</button>
<button class="b" onclick="move(0.10)">⏩ Forward +10%</button><br>
<button class="g" onclick="speed(1)">Normal</button>
<button class="b" onclick="speed(2.5)">Fast 2.5x</button>
<button class="g" onclick="restart()">🔄 Restart to Stockton</button>
<div id="s" style="margin-top:12px;background:#f8fafc;padding:10px;border-radius:8px;font-size:12px;border:1px solid #e2e8f0">Connecting to Firebase...</div>

<!-- YOUR BUTTON YOU WANTED -->
<a href="tracking.html" target="_blank" style="text-decoration:none;display:block;margin-top:14px">
<button style="width:100%;background:#0a2540;color:#fff;padding:15px;border-radius:10px;font-weight:900;font-size:15px">🔗 Go to Tracking Page → See Customer View</button>
</a>
<a href="index.html" target="_blank" style="text-decoration:none;display:block;margin-top:8px">
<button style="width:100%;background:#fff;color:#0a2540;border:2px solid #0a2540;padding:12px;border-radius:10px;font-weight:800">Go to Home Page</button>
</a>
</div></div>

<div class="main"><div class="map-card" style="flex:1"><div class="map-square"><div id="map"></div></div></div></div>

<script>
var STOCKTON=[54.561109,-1.303778],MORPETH=[55.16792,-1.68842];
var map=L.map('map').setView([54.86,-1.5],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
var route=[[54.561109,-1.303778],[54.584,-1.32],[54.62,-1.35],[54.68,-1.40],[54.78,-1.45],[54.85,-1.52],[54.92,-1.58],[55.02,-1.63],[55.08,-1.66],[55.12,-1.68],[55.16792,-1.68842]];
var vanIcon=L.divIcon({html:'<div style="background:#0a2540;border:2px solid #fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;">🚚</div>',className:'',iconSize:[38,38],iconAnchor:[19,19]});
var outer=L.polyline(route,{color:'#4285F4',weight:5}).addTo(map); var marker=L.marker(route[0],{icon:vanIcon}).addTo(map); map.fitBounds(outer.getBounds(),{padding:[30,30]});

const firebaseConfig = {
  apiKey: "AIzaSyAIiwQf65fHuMEYueD4XAHVGYadKPTXdo8",
  authDomain: "trustlogistics-package-dlv-100.firebaseapp.com",
  projectId: "trustlogistics-package-dlv-100",
  storageBucket: "trustlogistics-package-dlv-100.firebasestorage.app",
  messagingSenderId: "799430273591",
  appId: "1:799430273591:web:7fddd4d369b33ac224edb2",
  measurementId: "G-ZJ8LV304FZ"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const docRef=db.collection("packages").doc("ALLAN_DF_110_SHARED_TRIP_STOCKTON_WANSBECK_MORPETH");

let t={};
docRef.onSnapshot(s=>{
  if(!s.exists()){
    docRef.set({startTime:Date.now(),durationMs:4*60*60*1000,isPaused:false,pausedAt:0,accumulatedPause:0,speedFactor:1});
    document.getElementById('s').innerHTML='Creating trip... refresh';
    return;
  }
  t=s.data();
  if(!t.speedFactor || t.speedFactor==0) t.speedFactor=1;
  let elapsed=t.isPaused?(t.pausedAt-t.startTime-t.accumulatedPause):(Date.now()-t.startTime-t.accumulatedPause);
  elapsed*=(t.speedFactor||1);
  let p=Math.min(Math.max(elapsed/t.durationMs,0),0.998);
  if(t.manualProgress!=null) p=t.manualProgress;
  document.getElementById('s').innerHTML=(t.isPaused?'PAUSED':'LIVE')+' | '+(p*100).toFixed(1)+'% | Speed '+t.speedFactor+'x<br>Start: Stockton → Morpeth<br>Connected to Firebase ✔';
},e=>{
  document.getElementById('s').innerHTML='Firebase Error: '+e.message+'<br><br>Your Rules are correct! Just check your internet and refresh.';
});

function pause(){ docRef.update({isPaused:true,pausedAt:Date.now()}); }
function resume(){ if(t.isPaused) docRef.update({isPaused:false,accumulatedPause:(t.accumulatedPause||0)+(Date.now()-(t.pausedAt||0)),pausedAt:0}); }
function move(d){ let p=t.manualProgress!=null?t.manualProgress:0.5; let np=Math.min(Math.max(p+d,0),0.98); docRef.update({manualProgress:np}); setTimeout(()=>{docRef.update({manualProgress:firebase.firestore.FieldValue.delete()});},4000); }
function speed(f){ docRef.update({speedFactor:f}); }
function restart(){ if(confirm('Restart to Stockton?')) docRef.set({startTime:Date.now(),durationMs:4*60*60*1000,isPaused:false,pausedAt:0,accumulatedPause:0,speedFactor:1}); }
</script></body></html>
