<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin UK Multi-User</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f1f5f9}header{position:relative;padding:16px 18px;color:#fff;overflow:hidden}header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(7,25,50,0.94), rgba(7,25,50,0.75)), url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1600&auto=format&fit=crop');background-size:cover;background-position:center;z-index:0}.hdr{position:relative;z-index:1;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.main{max-width:1200px;margin:18px auto;padding:0 14px;display:flex;gap:18px}.map-card{flex:0 0 420px;width:420px;background:#fff;padding:12px;border-radius:18px;border:2px solid #0a2540}.map-square{width:100%;aspect-ratio:1/1;height:400px;border-radius:12px;overflow:hidden}#map{width:100%;height:100%}.info{flex:1;background:#fff;border-radius:18px;padding:16px;border:1px solid #e2e8f0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.badge{background:#eef2ff;padding:7px 12px;border-radius:20px;font-size:12px;border:1px solid #dbe2ff}.uk{font-size:11px;font-weight:700;background:#eef2ff;padding:6px 12px;border-radius:20px}button{padding:10px 14px;border:0;border-radius:10px;background:#0066ff;color:#fff;font-weight:bold;cursor:pointer}button.sec{background:#e5e7eb;color:#111}@media(max-width:800px){.main{flex-direction:column}.map-card{width:100%}}</style></head><body><header><div class="hdr"><div><h3>Admin - Multi-User Trip Control</h3><small id="ukClock">UK Time: -- | Shared Trip for ALL users</small></div><button class="sec" onclick="logout()">Logout</button></div></header><div class="main"><div class="map-card"><div class="map-square"><div id="map"></div></div></div><div class="info"><div class="row"><span class="badge" id="pos">Van: -</span><span class="badge" id="progress">0%</span><span class="badge" id="eta">ETA: -</span><span class="badge" id="gpsStatus">STATUS: In Transit</span></div><div class="row"><button onclick="resetTrip()">🔄 Reset Trip - For ALL Users (UK Time)</button><button class="sec" onclick="location.href='index.html'">View Tracking</button></div><div class="row"><span class="uk">Edit USERS in login.html to add more passwords</span></div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";let db=null;try{const a=initializeApp({projectId:"trustlogistics-package-dlv"});db=getFirestore(a);}catch(e){}function formatUK(date){return date.toLocaleString('en-GB',{timeZone:'Europe/London',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+" UK";}function formatUKFull(date){return date.toLocaleString('en-GB',{timeZone:'Europe/London',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})+" UK";}setInterval(()=>{document.getElementById('ukClock').innerText='UK Time: '+formatUKFull(new Date())+' | Shared Trip';},1000);const MORDEN=[51.4014,-0.1946],NORTH=[55.1674,-1.6911],ID="TRU-UK-VEH-001_SHARED_TRIP";const map=L.map('map',{zoomControl:false}).setView([53.2,-1.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let route=[MORDEN,NORTH],marker=null,line=null;const icon=L.divIcon({html:"🚐",className:"",iconSize:[32,32]});async function getRoute(){try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${MORDEN[1]},${MORDEN[0]};${NORTH[1]},${NORTH[0]}?overview=full&geometries=geojson`);const j=await r.json();if(j.routes)route=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);}catch(e){}if(line)map.removeLayer(line);line=L.polyline(route,{color:"#0066ff",weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[20,20]});}function interp(rt,t){const tot=rt.length-1,idx=t*tot,i=Math.floor(idx),f=idx-i;if(i>=tot)return rt[tot];const a=rt[i],b=rt[i+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}async function getTrip(){let s=localStorage.getItem('tl_shared_start');if(!s){s=Date.now();localStorage.setItem('tl_shared_start',s);}s=parseInt(s);let d={startTime:s,durationMs:8*60*60*1000,route};if(db){try{const ref=doc(db,"packages",ID);const snap=await getDoc(ref);if(snap.exists()){const dd=snap.data();if(dd.startTime)d.startTime=dd.startTime;}}catch(e){}}return d;}window.resetTrip=async()=>{const ns=Date.now();localStorage.setItem('tl_shared_start',ns);if(db){try{await setDoc(doc(db,"packages",ID),{startTime:ns,durationMs:8*60*60*1000,route,resetUK:formatUKFull(new Date())},{merge:true});}catch(e){}}location.reload();};window.logout=()=>{localStorage.removeItem('trust_admin');location.href='login.html';};(async()=>{await getRoute();const data=await getTrip();const rt=data.route?.length>2?data.route:route;function tick(){const now=Date.now();let p=(now-data.startTime)/data.durationMs;let arrived=false;if(p>=0.999){p=0.999;arrived=true;}if(p<0)p=0;if(p>=0.998)arrived=true;const pos=interp(rt,p);if(!marker)marker=L.marker(pos,{icon}).addTo(map);else marker.setLatLng(pos);document.getElementById('pos').innerText=`Van: [${pos[0].toFixed(4)}, ${pos[1].toFixed(4)}]`;document.getElementById('progress').innerText=`${(p*100).toFixed(1)}%`;const eta=new Date(Date.now()+Math.max(data.durationMs-(now-data.startTime),0));document.getElementById('eta').innerText=`ETA: ${formatUKFull(eta)}`;document.getElementById('gpsStatus').innerText=arrived?'STATUS: Arrived':'STATUS: In Transit';}tick();setInterval(tick,2000);})();</script></body></html>
