<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin - Allan/DF/110</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js'></script><script src='https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js'></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{background:#0f172a;color:#fff}.company-head{text-align:center;background:#fff;color:#0a2540;font-weight:900;padding:9px;font-size:14px}header{padding:12px 14px;background:#0a2540}.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.uk-badge{background:#eef2ff;color:#0a2540;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700}.admin-card{margin:12px}.admin-inner{background:#fff;color:#0a2540;border-radius:16px;padding:16px;border:2px solid #dc2626}button{border:0;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer;margin:4px}.p{background:#dc2626;color:#fff}.r{background:#16a34a;color:#fff}.y{background:#f59e0b;color:#000}.b{background:#2563eb;color:#fff}.g{background:#f1f5f9;border:1px solid #e2e8f0;color:#0a2540}#s{margin-top:12px;background:#f8fafc;padding:10px;border-radius:8px;font-size:12px;border:1px solid #e2e8f0;color:#0a2540}#map{height:420px;width:100%}.info{background:#fff;color:#0a2540;border-radius:16px;padding:12px;margin-top:12px}.badge{display:inline-block;background:#eef2ff;padding:6px 12px;border-radius:20px;font-size:12px;margin:3px}.dark{background:#0a2540;color:#fff}</style></head><body>
<div class="company-head">ADMIN - Matches your working tracking.html - Trust Logistics UK</div>
<header><div class="meta-row"><span class="uk-badge" id="ukClock">--</span><span class="uk-badge" id="statusTop">Connecting...</span><span class="uk-badge">trips / ALLAN_DF_110...</span></div></header>
<div class="admin-card"><div class="admin-inner">
<b>PACKAGE MOVEMENT CONTROL - Controls your current tracking.html</b><br><br>
<button class="p" onclick="pause()">⏸ Pause</button>
<button class="r" onclick="resume()">▶ Resume</button>
<button class="y" onclick="move(-0.10)">⏪ Rewind -10%</button>
<button class="b" onclick="move(0.10)">⏩ Forward +10%</button><br>
<button class="g" onclick="speed(1)">Normal</button>
<button class="b" onclick="speed(2.5)">Fast 2.5x</button>
<button class="g" onclick="restart()">🔄 Restart to Stockton</button>
<div id="s">Connecting to Firebase trips collection...</div>
<a href="tracking.html" target="_blank" style="text-decoration:none;display:block;margin-top:12px"><button style="width:100%;background:#0a2540;color:#fff;padding:14px;border-radius:10px;font-weight:900">🔗 Go to Tracking Page</button></a>
</div></div>
<div class="admin-card"><div id="map"></div><div class="info"><span class="badge dark" id="status">Live 0%</span><span class="badge" id="pos">Package: --</span><span class="badge" id="roadInfo">Road: --</span></div></div>
<script>
setInterval(()=>{let el=document.getElementById('ukClock');if(el)el.innerText=new Date().toLocaleString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' UK';},1000);
const firebaseConfig = {
  apiKey: "AIzaSyAIiwQf65fHuMEYueD4XAHVGYadKPTXdo8",
  authDomain: "trustlogistics-package-dlv-100.firebaseapp.com",
  projectId: "trustlogistics-package-dlv-100",
  storageBucket: "trustlogistics-package-dlv-100.firebasestorage.app",
  messagingSenderId: "799430273591",
  appId: "1:799430273591:web:7fddd4d369b33ac224edb2",
  measurementId: "G-ZJ8LV304FZ"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
// EXACT SAME AS YOUR WORKING tracking.html
const docRef=db.collection("trips").doc("ALLAN_DF_110_SHARED_TRIP_STOCKTON_WANSBECK_MORPETH");

const START=[54.57,-1.31],END=[55.15,-1.69];
let route=[START,END];
const map=L.map('map').setView([54.8,-1.35],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let routeLine=L.polyline(route,{color:'#4285F4',weight:5}).addTo(map);
let vanMarker=L.marker(route[0],{icon:L.divIcon({html:'🚚',className:'',iconSize:[30,30]})}).addTo(map);
async function loadOSRM(){try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${START[1]},${START[0]};${END[1]},${END[0]}?overview=full&geometries=geojson`);const j=await r.json();if(j.routes&&j.routes[0]){route=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);routeLine.setLatLngs(route);map.fitBounds(routeLine.getBounds(),{padding:[20,20]});}}catch(e){}}
loadOSRM();

let t={};
docRef.onSnapshot(s=>{
  if(!s.exists()){
    docRef.set({startTime:Date.now(),durationMs:14400000,isPaused:false,pausedAt:0,accumulatedPause:0,speedFactor:1,manualProgress:null});
    document.getElementById('s').innerText='Created trips doc - now connected';
    return;
  }
  t=s.data();
  let p=t.manualProgress!=null?t.manualProgress:((t.isPaused?(t.pausedAt-t.startTime-t.accumulatedPause):(Date.now()-t.startTime-t.accumulatedPause))*(t.speedFactor||1)/t.durationMs);
  p=Math.min(Math.max(p,0),0.998);
  document.getElementById('s').innerText=(t.isPaused?'PAUSED':'LIVE')+' | '+(p*100).toFixed(2)+'% | Speed '+ (t.speedFactor||1) +'x | Connected to trips collection';
  document.getElementById('statusTop').innerText=(t.isPaused?'PAUSED':'LIVE')+' '+(p*100).toFixed(1)+'%';
  document.getElementById('status').innerText='Live '+(p*100).toFixed(1)+'%';
  let idx=p*(route.length-1),i=Math.floor(idx),f=idx-i;if(i>=route.length-1){i=route.length-2;f=1;}
  let lat=route[i][0]+(route[i+1][0]-route[i][0])*f;let lng=route[i][1]+(route[i+1][1]-route[i][1])*f;
  vanMarker.setLatLng([lat,lng]);
  document.getElementById('pos').innerText='Package: ['+lat.toFixed(4)+','+lng.toFixed(4)+']';
},e=>{
  document.getElementById('s').innerText='FIRESTORE ERROR: '+e.message+'\nGo to Firebase > Firestore > Rules > set to allow read,write if true > Publish';
});

function pause(){if(!t.isPaused)docRef.update({isPaused:true,pausedAt:Date.now()});}
function resume(){if(t.isPaused)docRef.update({isPaused:false,accumulatedPause:(t.accumulatedPause||0)+(Date.now()-(t.pausedAt||Date.now())),pausedAt:0});}
function move(d){let p=t.manualProgress!=null?t.manualProgress:((t.isPaused?(t.pausedAt-t.startTime-t.accumulatedPause):(Date.now()-t.startTime-t.accumulatedPause))*(t.speedFactor||1)/t.durationMs);let np=Math.min(Math.max(p+d,0),0.98);docRef.update({manualProgress:np});setTimeout(()=>{docRef.update({manualProgress:firebase.firestore.FieldValue.delete(),startTime:Date.now()-np*t.durationMs/(t.speedFactor||1),accumulatedPause:0});},3000);}
function speed(f){docRef.update({speedFactor:f});}
function restart(){if(confirm('Restart to Stockton?'))docRef.set({startTime:Date.now(),durationMs:14400000,isPaused:false,pausedAt:0,accumulatedPause:0,speedFactor:1,manualProgress:firebase.firestore.FieldValue.delete()});}
</script></body></html>
