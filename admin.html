
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Morpeth Pause Play</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f1f5f9}header{position:relative;padding:16px 18px;color:#fff;overflow:hidden}header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(7,25,50,0.94), rgba(7,25,50,0.75)), url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1600&auto=format&fit=crop');background-size:cover;background-position:center;z-index:0}.hdr{position:relative;z-index:1;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.main{max-width:1200px;margin:18px auto;padding:0 14px;display:flex;gap:18px}.map-card{flex:0 0 420px;width:420px;background:#fff;padding:12px;border-radius:18px;border:2px solid #0a2540}.map-square{width:100%;aspect-ratio:1/1;height:400px;border-radius:12px;overflow:hidden}#map{width:100%;height:100%}.info{flex:1;background:#fff;border-radius:18px;padding:16px;border:1px solid #e2e8f0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.badge{background:#eef2ff;padding:7px 12px;border-radius:20px;font-size:12px;border:1px solid #dbe2ff}button{padding:11px 16px;border:0;border-radius:12px;font-weight:800;cursor:pointer}button.primary{background:#0066ff;color:#fff}button.pause{background:#f59e0b;color:#000}button.play{background:#16a34a;color:#fff}button.sec{background:#e5e7eb;color:#111}@media(max-width:800px){.main{flex-direction:column}.map-card{width:100%}}</style></head><body><header><div class="hdr"><div><h3>Admin - UK-CAR-DEL-1001 | Morpeth → Northumberland</h3><small id="ukClockAdmin" style="display:inline-block;margin-top:6px;background:rgba(255,255,255,0.15);padding:6px 12px;border-radius:20px;font-size:11px;border:1px solid rgba(255,255,255,0.2)">--</small></div><button class="sec" onclick="logout()">Logout</button></div></header><div class="main"><div class="map-card"><div class="map-square"><div id="map"></div></div><div style="text-align:center;font-size:11px;color:#64748b;margin-top:8px">Morpeth Route - Pause/Play syncs to ALL users</div></div><div class="info"><div class="row"><span class="badge" id="pos">Van: -</span><span class="badge" id="progress">0%</span><span class="badge" id="eta">ETA: -</span><span class="badge" id="gpsStatus">STATUS: In Transit</span><span class="badge" id="pauseState" style="background:#fef3c7;border-color:#f59e0b">▶ PLAYING</span></div><div class="row"><button id="pauseBtn" class="pause" onclick="togglePause()">⏸ Pause Movement</button><button class="primary" onclick="resetTrip()">🔄 Reset Trip</button><button class="sec" onclick="location.href='index.html'">View Tracking</button></div><div class="row" style="font-size:11px;color:#64748b">Pause stops van for ALL users tracking UK-CAR-DEL-1001 in real-time. Uses UK timezone.</div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";let db=null;try{const a=initializeApp({projectId:"trustlogistics-package-dlv"});db=getFirestore(a);}catch(e){}function formatUKFull(d){return d.toLocaleString('en-GB',{timeZone:'Europe/London',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})+" UK";}function formatUKClock(){return new Date().toLocaleString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'short',year:'numeric'})+" (UK)";}setInterval(()=>{const el=document.getElementById('ukClockAdmin');if(el)el.innerText=formatUKClock();},1000);const MORPETH=[55.1674,-1.6911],NORTH=[55.413,-1.708],ID="UK-CAR-DEL-1001_SHARED_TRIP_MORPETH";const map=L.map('map',{zoomControl:false}).setView([55.25,-1.7],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let route=[MORPETH,NORTH],marker=null,line=null;const icon=L.divIcon({html:"🚐",className:"",iconSize:[32,32]});async function getRoute(){try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${MORPETH[1]},${MORPETH[0]};${NORTH[1]},${NORTH[0]}?overview=full&geometries=geojson`);const j=await r.json();if(j.routes)route=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);}catch(e){}if(line)map.removeLayer(line);line=L.polyline(route,{color:"#0066ff",weight:6}).addTo(map);map.fitBounds(line.getBounds(),{padding:[30,30]});}function interp(rt,t){const tot=rt.length-1,idx=t*tot,i=Math.floor(idx),f=idx-i;if(i>=tot)return rt[tot];const a=rt[i],b=rt[i+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}let tripData={startTime:Date.now(),durationMs:8*60*60*1000,route,isPaused:false,pausedAt:0,accumulatedPause:0};async function loadTrip(){let s=localStorage.getItem('tl_shared_start_morpeth');if(!s){s=Date.now();localStorage.setItem('tl_shared_start_morpeth',s);}let localStart=parseInt(s);let localPaused=localStorage.getItem('tl_isPaused')==='true';let localPausedAt=parseInt(localStorage.getItem('tl_pausedAt')||'0');let localAcc=parseInt(localStorage.getItem('tl_accPause')||'0');tripData.startTime=localStart;tripData.isPaused=localPaused;tripData.pausedAt=localPausedAt;tripData.accumulatedPause=localAcc;if(db){try{const ref=doc(db,"packages",ID);const snap=await getDoc(ref);if(snap.exists()){const d=snap.data();if(d.startTime)tripData.startTime=d.startTime;if(d.isPaused!==undefined)tripData.isPaused=d.isPaused;if(d.pausedAt)tripData.pausedAt=d.pausedAt;if(d.accumulatedPause)tripData.accumulatedPause=d.accumulatedPause;localStorage.setItem('tl_shared_start_morpeth',tripData.startTime);localStorage.setItem('tl_isPaused',tripData.isPaused);localStorage.setItem('tl_pausedAt',tripData.pausedAt);localStorage.setItem('tl_accPause',tripData.accumulatedPause);}else{await setDoc(ref,{startTime:tripData.startTime,durationMs:tripData.durationMs,route,isPaused:false,pausedAt:0,accumulatedPause:0,awb:"UK-CAR-DEL-1001",origin:"Morpeth",createdUK:formatUKFull(new Date())});}}catch(e){}}return tripData;}async function saveTrip(){localStorage.setItem('tl_shared_start_morpeth',tripData.startTime);localStorage.setItem('tl_isPaused',tripData.isPaused);localStorage.setItem('tl_pausedAt',tripData.pausedAt);localStorage.setItem('tl_accPause',tripData.accumulatedPause);if(db){try{await setDoc(doc(db,"packages",ID),{startTime:tripData.startTime,isPaused:tripData.isPaused,pausedAt:tripData.pausedAt,accumulatedPause:tripData.accumulatedPause,durationMs:tripData.durationMs,route,updatedUK:formatUKFull(new Date())},{merge:true});}catch(e){}}}function getEffectiveProgress(){const now=Date.now();if(tripData.isPaused){const elapsed=(tripData.pausedAt - tripData.startTime - tripData.accumulatedPause);return elapsed / tripData.durationMs;}else{const elapsed=(now - tripData.startTime - tripData.accumulatedPause);return elapsed / tripData.durationMs;}}window.togglePause=async()=>{if(!tripData.isPaused){tripData.isPaused=true;tripData.pausedAt=Date.now();}else{const pauseDur=Date.now()-tripData.pausedAt;tripData.accumulatedPause+=pauseDur;tripData.isPaused=false;tripData.pausedAt=0;}await saveTrip();updatePauseUI();};function updatePauseUI(){const btn=document.getElementById('pauseBtn');const state=document.getElementById('pauseState');if(tripData.isPaused){btn.innerText='▶ Play Movement';btn.className='play';state.innerText='⏸ PAUSED';state.style.background='#fee2e2';state.style.borderColor='#ef4444';}else{btn.innerText='⏸ Pause Movement';btn.className='pause';state.innerText='▶ PLAYING';state.style.background='#dcfce7';state.style.borderColor='#16a34a';}}window.resetTrip=async()=>{const ns=Date.now();tripData.startTime=ns;tripData.isPaused=false;tripData.pausedAt=0;tripData.accumulatedPause=0;await saveTrip();location.reload();};window.logout=()=>{localStorage.removeItem('trust_admin');location.href='login.html';};(async()=>{await getRoute();await loadTrip();updatePauseUI();const rt=route;function tick(){let p=getEffectiveProgress();let arrived=false;if(p>=0.999){p=0.999;arrived=true;}if(p<0)p=0;if(p>=0.998)arrived=true;const pos=interp(rt,p);if(!marker)marker=L.marker(pos,{icon}).addTo(map);else marker.setLatLng(pos);document.getElementById('pos').innerText=`Van: [${pos[0].toFixed(4)}, ${pos[1].toFixed(4)}]`;document.getElementById('progress').innerText=`${(p*100).toFixed(1)}%`;const remainingMs=Math.max(tripData.durationMs - (p*tripData.durationMs),0);const eta=new Date(Date.now()+remainingMs);document.getElementById('eta').innerText=`ETA: ${formatUKFull(eta)}`;document.getElementById('gpsStatus').innerText=arrived?'STATUS: Arrived':(tripData.isPaused?'STATUS: Paused':'STATUS: In Transit');}tick();setInterval(async()=>{if(db){try{const ref=doc(db,"packages",ID);const snap=await getDoc(ref);if(snap.exists()){const d=snap.data();tripData.startTime=d.startTime||tripData.startTime;if(d.isPaused!==undefined&&d.isPaused!==tripData.isPaused){tripData.isPaused=d.isPaused;tripData.pausedAt=d.pausedAt||0;tripData.accumulatedPause=d.accumulatedPause||0;updatePauseUI();}else if(!d.isPaused&&tripData.isPaused===false){tripData.accumulatedPause=d.accumulatedPause||tripData.accumulatedPause;}}}catch(e){}}tick();},2000);})();</script></body></html>
