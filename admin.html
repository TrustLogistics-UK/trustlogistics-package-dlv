<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - TrustLogistics</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial} body{background:#f0f2f5} header{background:#0a2540;color:#fff;padding:12px;text-align:center} #map{height:62vh;width:100%} .panel{background:#fff;margin:8px;padding:12px;border-radius:12px} .badge{background:#eef2ff;padding:6px 10px;border-radius:20px;font-size:12px;display:inline-block;margin:3px} .row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0} button{padding:10px 14px;border:0;border-radius:8px;background:#0066ff;color:#fff;font-weight:bold}</style></head><body><script>if(localStorage.getItem('trust_admin')!=='yes'){ location.href='login.html'; }</script><header><h3>Admin Panel - Live Sync</h3><small>AWB: TRU-UK-VEH-001 | Same van as customer</small></header><div id="map"></div><div class="panel"><div class="row"><span class="badge">AWB: TRU-UK-VEH-001</span><span class="badge">VIN: H432110/IMEI/110</span><span class="badge" id="etaTxt">ETA: -</span></div><div class="row"><span class="badge">Origin: Morden [51.4014, -0.1946]</span><span class="badge">Dest: Northumberland [55.1674, -1.6911]</span></div><div class="row"><span class="badge" id="posTxt">Van: -</span><span class="badge" id="statusTxt">Status: In Transit</span></div><div class="row"><button onclick="resetTrip()">Reset Trip - Restart from Morden</button><button onclick="location.href='index.html'">View Customer</button><button onclick="logout()">Logout</button></div></div><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"; import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; const firebaseConfig={projectId:"trustlogistics-package-dlv"}; const app=initializeApp(firebaseConfig); const db=getFirestore(app); const MORDEN=[51.4014,-0.1946]; const NORTH=[55.1674,-1.6911]; const TRACK_ID="TRU-UK-VEH-001"; const map=L.map('map').setView([53.2,-1.2],6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); let routeCoords=[MORDEN,NORTH]; let vanMarker,routeLine; const vanIcon=L.divIcon({html:"🚐",className:"",iconSize:[32,32]}); async function getRoute(){ try{ const url=`https://router.project-osrm.org/route/v1/driving/${MORDEN[1]},${MORDEN[0]};${NORTH[1]},${NORTH[0]}?overview=full&geometries=geojson`; const r=await fetch(url); const j=await r.json(); if(j.routes&&j.routes[0]) routeCoords=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);}catch(e){} if(routeLine) map.removeLayer(routeLine); routeLine=L.polyline(routeCoords,{color:"#0066ff",weight:6}).addTo(map); map.fitBounds(routeLine.getBounds(),{padding:[40,40]});} function interpolateRoute(route,t){ const total=route.length-1; const idx=t*total; const i=Math.floor(idx); const f=idx-i; if(i>=total) return route[total]; const a=route[i], b=route[i+1]; return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];} async function ensureTrip(){ const ref=doc(db,"packages",TRACK_ID); const snap=await getDoc(ref); if(!snap.exists()){ const start=Date.now(); const dur=8*60*60*1000; await setDoc(ref,{origin:MORDEN,dest:NORTH,startTime:start,durationMs:dur,route:routeCoords,status:"In Transit",awb:"TRU-UK-VEH-001",vin:"H432110/IMEI/110"}); return {startTime:start,durationMs:dur,route:routeCoords}; } return snap.data();} window.resetTrip=async()=>{ const ref=doc(db,"packages",TRACK_ID); await setDoc(ref,{startTime:Date.now(),durationMs:8*60*60*1000,route:routeCoords},{merge:true}); location.reload();}; window.logout=()=>{ localStorage.removeItem('trust_admin'); location.href='login.html';}; (async()=>{ await getRoute(); const data=await ensureTrip(); const route=data.route&&data.route.length>2?data.route:routeCoords; function upd(){ const now=Date.now(); let prog=(now-data.startTime)/data.durationMs; if(prog>0.999) prog=0.999; const pos=interpolateRoute(route,prog); if(!vanMarker) vanMarker=L.marker(pos,{icon:vanIcon}).addTo(map); else vanMarker.setLatLng(pos); document.getElementById('posTxt').innerText=`Van: [${pos[0].toFixed(4)}, ${pos[1].toFixed(4)}]`; const rem=data.durationMs-(now-data.startTime); document.getElementById('etaTxt').innerText=`ETA: ${new Date(now+Math.max(rem,0)).toLocaleString()}`; document.getElementById('statusTxt').innerText=`Status: ${(prog*100).toFixed(1)}%`; } upd(); setInterval(upd,2000);})();</script></body></html>
