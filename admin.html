
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Trust Logistics</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9}
.top{background:#fff;text-align:center;padding:12px;font-weight:900;border-bottom:1px solid #e2e8f0}
.main{max-width:1200px;margin:12px auto;padding:0 12px;display:flex;gap:14px;flex-wrap:wrap}
.left{flex:1 1 600px}.right{flex:0 1 350px;width:100%}
.map-card{background:#fff;padding:8px;border-radius:18px;border:2px solid #0a2540}
#map{width:100%;height:460px;border-radius:12px}
.btn{border:0;padding:12px 16px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;color:#fff;margin:4px;display:inline-block;text-decoration:none}
.pause{background:#ef4444}.play{background:#16a34a}.reset{background:#0f172a}.goto{background:#2563eb}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:8px}
</style></head><body>
<div class="top">ADMIN - Stockton (Thornaby) TS17 6QR -> 8 Wansbeck St NE61 1XZ</div>
<div class="main"><div class="left"><div class="map-card"><div id="map"></div></div>
<div style="margin-top:10px">
<button class="btn pause" id="bPause">Pause</button>
<button class="btn play" id="bPlay">Play</button>
<button class="btn reset" id="bReset">Reset 4hr Trip</button>
<a class="btn goto" href="tracking.html" onclick="localStorage.setItem('trust_track','yes')">Go to Allans Page -></a>
</div>
<div class="box"><div>Progress: <b id="prog">0%</b> | Paused: <b id="paused">false</b> | Van: <b id="van">-</b></div><div style="margin-top:6px;font-size:12px" id="fb">Firebase: Connecting...</div></div>
</div><div class="right"><div class="box">REF: Allan/DF/110<br>Stockton -> Wansbeck Street</div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore, doc, setDoc, updateDoc, onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
let db=null; try{db=getFirestore(initializeApp({projectId:"trustlogistics-package-dlv"}));}catch(e){document.getElementById('fb').innerText='Firebase init failed';}
const STOCKTON=[54.561109,-1.303778],MORPETH=[55.16792,-1.68842];
const map=L.map('map').setView([54.86,-1.5],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let route=[STOCKTON,MORPETH],outer=null,inner=null,marker=null;
const icon=L.divIcon({html:'VAN',className:'',iconSize:[32,32]});
async function getRoute(){try{const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+STOCKTON[1]+','+STOCKTON[0]+';'+MORPETH[1]+','+MORPETH[0]+'?overview=full&geometries=geojson');const j=await r.json();if(j.routes&&j.routes[0])route=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);}catch(e){}if(outer)map.removeLayer(outer);if(inner)map.removeLayer(inner);outer=L.polyline(route,{color:'#fff',weight:7}).addTo(map);inner=L.polyline(route,{color:'#4285F4',weight:4}).addTo(map);map.fitBounds(outer.getBounds(),{padding:[20,20]});}
function interp(rt,t){const tot=rt.length-1,idx=t*tot,i=Math.floor(idx),f=idx-i;if(i>=tot)return rt[tot];const a=rt[i],b=rt[i+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}
let trip={startTime:Date.now(),durationMs:4*60*60*1000,isPaused:false,pausedAt:0,accumulatedPause:0};
let prog=0;
function recalc(){let el=trip.isPaused?(trip.pausedAt-trip.startTime-trip.accumulatedPause):(Date.now()-trip.startTime-trip.accumulatedPause);prog=Math.min(Math.max(el/trip.durationMs,0),0.998);}
const docRef=db?doc(db,"packages","ALLAN_DF_110_SHARED_TRIP_STOCKTON_WANSBECK_MORPETH"):null;
async function init(){
await getRoute();
if(!docRef){document.getElementById('fb').innerText='No DB';return;}
onSnapshot(docRef,(snap)=>{
if(snap.exists()){
const d=snap.data();
trip.startTime=d.startTime||trip.startTime;
trip.durationMs=d.durationMs||trip.durationMs;
trip.isPaused=!!d.isPaused;
trip.pausedAt=d.pausedAt||0;
trip.accumulatedPause=d.accumulatedPause||0;
recalc();update();
document.getElementById('fb').innerText='Live Connected - Stockton -> Wansbeck St';
}else{
setDoc(docRef,trip).then(()=>{document.getElementById('fb').innerText='Trip Created';});
}
});
setInterval(function(){if(!trip.isPaused)recalc();update();},1000);
}
function update(){
var p=prog;
var pos=interp(route,p);
if(!marker)marker=L.marker(pos,{icon}).addTo(map);else marker.setLatLng(pos);
document.getElementById('prog').innerText=(p*100).toFixed(2)+'%';
document.getElementById('paused').innerText=trip.isPaused?'true':'false';
document.getElementById('van').innerText=pos[0].toFixed(4)+', '+pos[1].toFixed(4);
}
document.getElementById('bPause').addEventListener('click',async function(){if(!docRef)return;trip.isPaused=true;trip.pausedAt=Date.now();await updateDoc(docRef,{isPaused:true,pausedAt:trip.pausedAt});});
document.getElementById('bPlay').addEventListener('click',async function(){if(!docRef||!trip.isPaused)return;var now=Date.now();var pd=now-(trip.pausedAt||now);trip.accumulatedPause=(trip.accumulatedPause||0)+pd;trip.isPaused=false;trip.pausedAt=0;await updateDoc(docRef,{isPaused:false,accumulatedPause:trip.accumulatedPause,pausedAt:0});});
document.getElementById('bReset').addEventListener('click',async function(){if(!docRef)return;trip={startTime:Date.now(),durationMs:4*60*60*1000,isPaused:false,pausedAt:0,accumulatedPause:0};await setDoc(docRef,trip);});
init();
</script></body></html>
