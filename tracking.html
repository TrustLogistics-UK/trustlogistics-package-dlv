<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustLogistics - Live Tracking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#f1f5f9}
header{background:#0a2540;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
#map{height:55vh;width:100%}
.info{background:#fff;margin:12px;border-radius:16px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.row b{color:#0a2540}
.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:10px}
#progress{height:100%;width:0%;background:#0066ff;transition:width .5s}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.moving{background:#dcfce7;color:#166534}
.stopped{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header>
<div><b>TrustLogistics</b><div style="font-size:10px;opacity:.7">Allan/DF/110 • H43245/IMEI/1001</div></div>
<div><button onclick="logout()" style="background:#fff;color:#0a2540;border:none;padding:6px 12px;border-radius:8px;font-weight:800;font-size:11px;cursor:pointer">Logout</button></div>
</header>

<div id="map"></div>

<div class="info">
<div class="row"><span>Status</span><b><span id="state" class="badge moving">Moving</span></b></div>
<div class="row"><span>Speed</span><b id="speed">62 mph</b></div>
<div class="row"><span>Current Road</span><b id="road">A19</b></div>
<div class="row"><span>ETA Morpeth</span><b id="eta">Calculating...</b></div>
<div class="row"><span>Vehicle</span><b>Defender - Stockton → Morpeth</b></div>
<div class="bar"><div id="progress"></div></div>
<div style="margin-top:10px"><img src="./defender.jpg" style="width:100%;border-radius:12px;max-height:200px;object-fit:cover" onerror="this.style.display='none'"></div>
</div>

<script>
// --- LOGIN CHECK ---
if(localStorage.getItem('trust_track')!=='yes'){location.href='./index.html';}
function logout(){localStorage.removeItem('trust_track');location.href='./index.html';}

// --- FIREBASE - KEEP YOUR OWN CONFIG HERE ---
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection('trips').doc('ALLAN_DF_110_SHARED_TRIP_STOCKTON_WANSBECK_MORPETH');

// --- ROUTE Stockton to Morpeth via A19/A1 ---
const route = [
[54.570, -1.310], // Stockton
[54.700, -1.300], // A19
[54.900, -1.400],
[55.050, -1.550], // A1
[55.150, -1.690], // Morpeth
];
const map = L.map('map').setView([54.8, -1.35], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.polyline(route,{color:'#0066ff',weight:5}).addTo(map);
const vanMarker = L.marker(route[0],{icon:L.divIcon({html:'🚚',className:'',iconSize:[30,30]})}).addTo(map);

// --- FIX 1: DON'T RESTART ON REFRESH ---
var SAVED_START = parseInt(localStorage.getItem('tl_shared_start_thornton')||'0');
var trip={startTime:SAVED_START || Date.now(),durationMs:4*60*60*1000,isPaused:false,pausedAt:0,accumulatedPause:0,speedFactor:1,manualProgress:null};
if(!SAVED_START) localStorage.setItem('tl_shared_start_thornton', String(trip.startTime));

function getProgress(){
  if(trip.manualProgress!==null) return Math.min(1, Math.max(0, trip.manualProgress));
  if(trip.isPaused){
    var elapsedPause = (trip.pausedAt - trip.startTime - trip.accumulatedPause);
    return Math.min(1, elapsedPause / trip.durationMs);
  }
  var elapsed = Date.now() - trip.startTime - trip.accumulatedPause;
  return Math.min(1, Math.max(0, elapsed / trip.durationMs));
}

function tick(){
  var p = getProgress();
  // Interpolate position
  var idx = p * (route.length-1);
  var i = Math.floor(idx);
  var f = idx - i;
  if(i >= route.length-1){ i = route.length-2; f=1; }
  var lat = route[i][0] + (route[i+1][0]-route[i][0])*f;
  var lng = route[i][1] + (route[i+1][1]-route[i][1])*f;
  vanMarker.setLatLng([lat,lng]);

  // Progress bar
  document.getElementById('progress').style.width = (p*100)+'%';

  // FIX 2: PAUSE = NOT MOVING
  var isStopped = trip.isPaused || p>=1;
  if(isStopped){
    document.getElementById('speed').innerText = 'Not Moving';
    document.getElementById('road').innerText = 'Not Moving';
    document.getElementById('eta').innerText = 'Not Moving';
    document.getElementById('state').innerText = 'Not Moving';
    document.getElementById('state').className = 'badge stopped';
  } else {
    document.getElementById('speed').innerText = (55 + Math.round(Math.random()*10)) + ' mph';
    document.getElementById('road').innerText = p < 0.5 ? 'A19' : 'A1(M)';
    var remainingMs = (1-p)*trip.durationMs;
    var mins = Math.round(remainingMs/60000);
    document.getElementById('eta').innerText = mins + ' mins to Morpeth';
    document.getElementById('state').innerText = 'Moving';
    document.getElementById('state').className = 'badge moving';
  }
}

setInterval(tick, 1000);

// Firebase sync
docRef.onSnapshot(function(snap){
  if(snap.exists()){
    var d=snap.data();
    trip.startTime=d.startTime||trip.startTime;
    trip.durationMs=d.durationMs||trip.durationMs;
    trip.isPaused=!!d.isPaused;
    trip.pausedAt=d.pausedAt||0;
    trip.accumulatedPause=d.accumulatedPause||0;
    trip.speedFactor=d.speedFactor||1;
    trip.manualProgress=(d.manualProgress!==undefined)?d.manualProgress:null;
  } else {
    // Create doc once so refresh doesn't restart
    docRef.set(trip).catch(()=>{});
  }
});

tick();
</script>
</body>
</html>
