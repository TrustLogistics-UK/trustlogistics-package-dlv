
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Allan/DF/110</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f1f5f9}header{background:#0a2540;color:#fff;padding:14px;text-align:center}.hdr{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;flex-wrap:wrap;gap:10px}#map{height:70vh;width:100%}.bar{padding:10px;background:#fff;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.badge{background:#eef2ff;padding:8px 12px;border-radius:20px;font-size:12px}.btn{background:#0a2540;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:12px}</style></head><body>
<script>
if(localStorage.getItem('trust_track')!=='yes'){location.replace('index.html');}
const awb=localStorage.getItem('trust_awb')||''; 
if(awb && awb!=='Allan/DF/110' && localStorage.getItem('trust_user')!=='Admin'){location.replace('index.html');}
</script>
<header><div class="hdr"><div><h2>REF: Allan/DF/110 - LIVE</h2><small>Thornton UK → Morpeth Northumberland</small></div><div><a href="index.html" class="btn" onclick="localStorage.clear();">Logout</a></div></div></header>
<div id="map"></div>
<div class="bar"><span class="badge" id="origin">Origin: Thornton UK</span><span class="badge" id="progress">0%</span><span class="badge" id="eta">ETA: -</span><span class="badge" id="dest">Dest: Morpeth Northumberland</span></div>
<div style="padding:10px;background:#fff;margin:10px;border-radius:12px"><b>Status:</b> <span id="status">In Transit</span><br><b>Van:</b> <span id="pos">-</span><br><b>UK Time:</b> <span id="uk"></span></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app = initializeApp({projectId:"trustlogistics-package-dlv"}); const db = getFirestore(app);
const THORNTON=[55.174,-1.8476], MORPETH=[55.1674,-1.6911];
const map=L.map('map').setView([55.17,-1.77],11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let route=[THORNTON,MORPETH], marker, outer, inner;
async function getRoute(){
 try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${THORNTON[1]},${THORNTON[0]};${MORPETH[1]},${MORPETH[0]}?overview=full&geometries=geojson`); const j=await r.json(); if(j.routes&&j.routes[0]) route=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);}catch(e){}
 if(outer) map.removeLayer(outer); if(inner) map.removeLayer(inner);
 outer=L.polyline(route,{color:"#fff",weight:7}).addTo(map); inner=L.polyline(route,{color:"#4285F4",weight:4}).addTo(map); map.fitBounds(outer.getBounds(),{padding:[30,30]});
}
function interp(rt,t){const tot=rt.length-1,idx=t*tot,i=Math.floor(idx),f=idx-i; if(i>=tot)return rt[tot]; const a=rt[i],b=rt[i+1]; return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}
setInterval(()=>{document.getElementById('uk').innerText=new Date().toLocaleString('en-GB',{timeZone:'Europe/London',hour12:false})+' UK';},1000);
async function tick(){
 const snap=await getDoc(doc(db,"packages","ALLAN_DF_110_SHARED_TRIP_THORNTON_MORPETH"));
 let d=snap.exists()?snap.data():{startTime:parseInt(localStorage.getItem('tl_shared_start_thornton')||Date.now()), durationMs:8*60*60*1000, isPaused:false, pausedAt:0, accumulatedPause:0};
 let prog=d.isPaused?(d.pausedAt-d.startTime-d.accumulatedPause)/d.durationMs:(Date.now()-d.startTime-d.accumulatedPause)/d.durationMs;
 if(prog>0.998) prog=0.998; if(prog<0) prog=0;
 const pos=interp(route,prog);
 if(!marker) marker=L.marker(pos).addTo(map); else marker.setLatLng(pos);
 document.getElementById('progress').innerText=(prog*100).toFixed(1)+'%';
 document.getElementById('pos').innerText=pos[0].toFixed(4)+', '+pos[1].toFixed(4);
 document.getElementById('status').innerText=d.isPaused?'Paused - Allan/DF/110':'In Transit - '+(prog*100).toFixed(1)+'%';
 const eta=new Date(Date.now()+(d.durationMs-prog*d.durationMs)); document.getElementById('eta').innerText='ETA: '+eta.toLocaleString('en-GB',{timeZone:'Europe/London'})+' UK';
}
await getRoute(); tick(); setInterval(tick,2000);
</script></body></html>
