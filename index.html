<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustLogistics-package</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
header{background:#0a2540;color:#fff;padding:14px;text-align:center}
#homeMap{height:50vh;width:100%;border-bottom:4px solid #0066ff}
.controls{background:#f5f7fb;padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls input{padding:10px;border:1px solid #ccc;border-radius:8px;min-width:180px}
.btn{background:#0066ff;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:bold}
.nav{display:flex;justify-content:center;gap:12px;margin:12px}
.nav a{color:#0066ff;text-decoration:none;font-weight:bold;border:1px solid #0066ff;padding:8px 14px;border-radius:20px}
</style>
</head>
<body>
<header><h1>TrustLogistics-package</h1></header>
<div id="homeMap"></div>
<div class="controls">
<input id="trackId" placeholder="Enter Tracking ID e.g. TL-123">
<button class="btn" onclick="goTrack()">Track Package</button>
</div>
<div class="nav"><a href="track.html">Customer Tracking</a><a href="admin.html">Admin</a></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {projectId:"trustlogistics-package-dlv"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const map = L.map('homeMap').setView([51.5074,-0.1278],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker;
async function loadLatest(){
 try{
  const d = await getDoc(doc(db,"settings","current"));
  if(d.exists() && d.data().lat){
   const data=d.data(); if(marker) map.removeLayer(marker);
   marker=L.marker([data.lat,data.lng]).addTo(map); map.setView([data.lat,data.lng],11);
  }
 }catch(e){}
}
loadLatest();
window.goTrack=()=>{const id=document.getElementById('trackId').value.trim(); if(!id) return alert('Enter ID'); location.href='track.html?id='+encodeURIComponent(id);}
</script>
</body>
</html>
