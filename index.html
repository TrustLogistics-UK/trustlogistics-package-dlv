
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Tracking Fixed</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f0f2f5}header{background:#0a2540;color:#fff;padding:12px;text-align:center}#map{height:65vh;width:100%}.panel{background:#fff;margin:8px;padding:14px;border-radius:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.badge{background:#eef2ff;padding:7px 12px;border-radius:20px;font-size:12px;border:1px solid #dbe2ff}.dark{background:#0a2540;color:#fff}</style></head><body><header><h3>TrustLogistics - Live Tracking</h3><small>AWB: TRU-UK-VEH-001 | Shared Van with Admin</small></header><div id="map"></div><div class="panel"><div class="row"><span class="badge dark" id="status">Status: In Transit - Live</span><span class="badge" id="progress">0%</span><span class="badge" id="eta">ETA: -</span></div><div class="row"><span class="badge" id="origin">Origin: Morden [51.4014, -0.1946]</span><span class="badge" id="dest">Dest: Northumberland [55.1674, -1.6911]</span></div><div class="row"><span class="badge" id="pos">Van Position: -</span><span class="badge">In Transit on M1</span></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";let db=null;try{const app=initializeApp({projectId:"trustlogistics-package-dlv"});db=getFirestore(app);}catch(e){}const MORDEN=[51.4014,-0.1946],NORTH=[55.1674,-1.6911],TRACK_ID="TRU-UK-VEH-001";const map=L.map('map',{zoomControl:false}).setView([53.2,-1.2],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let routeCoords=[MORDEN,NORTH],vanMarker=null,routeLine=null;const vanIcon=L.divIcon({html:"🚐",className:"",iconSize:[32,32]});async function getRoute(){try{const url=`https://router.project-osrm.org/route/v1/driving/${MORDEN[1]},${MORDEN[0]};${NORTH[1]},${NORTH[0]}?overview=full&geometries=geojson`;const r=await fetch(url);const j=await r.json();if(j.routes&&j.routes[0])routeCoords=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);}catch(e){}if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(routeCoords,{color:"#0066ff",weight:6}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[30,30]});}function interp(route,t){const total=route.length-1,idx=t*total,i=Math.floor(idx),f=idx-i;if(i>=total)return route[total];const a=route[i],b=route[i+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}async function getTripData(){let start=localStorage.getItem('tl_start');if(!start){start=Date.now();localStorage.setItem('tl_start',start);}else start=parseInt(start);let data={startTime:start,durationMs:8*60*60*1000,route:routeCoords};if(db){try{const ref=doc(db,"packages",TRACK_ID);const snap=await getDoc(ref);if(!snap.exists()){await setDoc(ref,{startTime:start,durationMs:data.durationMs,route:routeCoords,awb:TRACK_ID});}else{const d=snap.data();if(d.startTime)data.startTime=d.startTime;if(d.route&&d.route.length>2)data.route=d.route;}}catch(e){console.log("firebase fallback",e);}}return data;}(async()=>{await getRoute();const data=await getTripData();const route=data.route&&data.route.length>2?data.route:routeCoords;function tick(){const now=Date.now();let prog=(now-data.startTime)/data.durationMs;if(prog>0.999)prog=0.999;if(prog<0)prog=0;const pos=interp(route,prog);if(!vanMarker)vanMarker=L.marker(pos,{icon:vanIcon}).addTo(map);else vanMarker.setLatLng(pos);document.getElementById('pos').innerText=`Van Position: [${pos[0].toFixed(4)}, ${pos[1].toFixed(4)}]`;document.getElementById('progress').innerText=`${(prog*100).toFixed(1)}%`;const rem=data.durationMs-(now-data.startTime);document.getElementById('eta').innerText=`ETA: ${new Date(now+Math.max(rem,0)).toLocaleString()}`;document.getElementById('status').innerText=`Status: In Transit - Live ${ (prog*100).toFixed(1)}%`;}tick();setInterval(tick,2000);})();</script></body></html>
